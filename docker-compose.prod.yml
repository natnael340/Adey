volumes:
  certbot_conf:
  certbot_www:

# Shared by backend_blue / backend_green. Deploys run devops/scripts/deploy.sh,
# which starts the idle color, waits for it to be healthy, then switches nginx.
x-backend: &backend
  image: ghcr.io/natnael340/adey:${IMAGE_TAG:-latest}
  # unless-stopped: after a reboot the live color comes back, the idle one stays down
  restart: unless-stopped
  working_dir: /usr/src/app
  env_file:
    - .production.env
  networks:
    - adey_network
  expose:
    - 8000
  stop_grace_period: 5m
  command: daphne -b 0.0.0.0 -p 8000 adey.asgi:application
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  backend_blue:
    <<: *backend

  backend_green:
    <<: *backend

  migrate:
    image: ghcr.io/natnael340/adey:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    working_dir: /usr/src/app
    env_file:
      - .production.env
    networks:
      - adey_network
    command: python manage.py migrate --noinput

  worker:
    image: ghcr.io/natnael340/adey:${IMAGE_TAG:-latest}
    container_name: adey_celery_worker
    restart: on-failure
    working_dir: /usr/src/app
    env_file:
      - .production.env
    depends_on:
      - broker
    networks:
      - adey_network
    # celery does a warm shutdown on SIGTERM; give running tasks time to finish
    stop_grace_period: 120s
    command: celery -A adey worker --loglevel=info

  broker:
    image: rabbitmq:3-management
    hostname: rabbit1
    env_file:
      - .production.env
    networks:
      - adey_network

  nginx:
    image: nginx:alpine
    container_name: adey_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/conf.d/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./devops/nginx/upstream:/etc/nginx/upstream:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - adey_network

  certbot:
    image: certbot/certbot
    container_name: adey_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - adey_network

networks:
  adey_network:
    ipam:
      driver: default
