name: Adey CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adey
          POSTGRES_PASSWORD: adey
          POSTGRES_DB: adey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENV: test
      ENVIRONMENT: development
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://adey:adey@localhost:5432/adey
      PG_VECTOR_DB_URL: postgresql://adey:adey@localhost:5432/adey
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DEFAULT_FILE_STORAGE: django.core.files.storage.InMemoryStorage
      STATICFILES_STORAGE: django.core.files.storage.InMemoryStorage
      OPENAI_API_KEY: sk-ci-dummy
      STRIPE_SECRET_TEST_KEY: ci
      PAYPAL_CLIENT_ID: ci
      PAYPAL_CLIENT_SECRET: ci
      PAYPAL_ACCESS_TOKEN: ci
      PAYPAL_SELLER_ID: ci
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      AWS_STORAGE_BUCKET_NAME: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest

  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/docker/python/Dockerfile
          push: true
          tags: |
            ghcr.io/natnael340/adey:${{ github.sha }}
            ghcr.io/natnael340/adey:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to EC2 (blue/green)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -e
            cd ~/Adey
            git fetch origin main
            git reset --hard origin/main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ./devops/scripts/deploy.sh "$IMAGE_TAG"
