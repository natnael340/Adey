name: Adey CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adey
          POSTGRES_PASSWORD: adey
          POSTGRES_DB: adey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENV: test
      ENVIRONMENT: development
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://adey:adey@localhost:5432/adey
      PG_VECTOR_DB_URL: postgresql://adey:adey@localhost:5432/adey
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DEFAULT_FILE_STORAGE: django.core.files.storage.InMemoryStorage
      STATICFILES_STORAGE: django.core.files.storage.InMemoryStorage
      OPENAI_API_KEY: sk-ci-dummy
      STRIPE_SECRET_TEST_KEY: ci
      PAYPAL_CLIENT_ID: ci
      PAYPAL_CLIENT_SECRET: ci
      PAYPAL_ACCESS_TOKEN: ci
      PAYPAL_SELLER_ID: ci
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      AWS_STORAGE_BUCKET_NAME: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create test environment file
        run: ./.github/scripts/gen-env.sh

      - name: Set up Docker Compose
        run: docker compose -f docker-compose.staging.yml build

      - name: Run Docker containers
        run: docker compose -f docker-compose.staging.yml up -d

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            🚀 Automated release for ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Adey
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
